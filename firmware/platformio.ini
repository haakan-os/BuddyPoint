; PlatformIO Project Configuration File for HaakanPoint (Xteink X3)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = xteink_x3
src_dir = src
include_dir = include

[env:xteink_x3]
platform = espressif32@^6.5.0
board = esp32-c3-devkitm-1
framework = arduino

; Target ESP32-C3 microcontroller (160MHz, 4MB flash)
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = partitions_4mb.csv

; Monitor and Upload settings
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D HAAKANPOINT_VERSION=\"1.0.0\"
    -D DEVICE_XTEINK_X3
    -D EPD_WIDTH=528
    -D EPD_HEIGHT=792
    -O2

lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    greiman/SdFat@^2.2.2
