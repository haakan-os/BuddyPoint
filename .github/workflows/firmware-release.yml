name: Publish OTA release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable release tag matching crosspoint-upstream/platformio.ini (for example v1.6.6)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: firmware-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate version and ensure this is a new release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_release_version.py "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists. Bump the configured version for a new release.'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This tag already exists. Choose a new version.'
            exit 1
          fi
      - name: Install firmware build tools
        run: |
          python -m pip install https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          python -m pip install 'littlefs-python>=0.16.0' 'fatfs-ng>=0.1.14' 'pyyaml>=6.0.2' \
            'rich-click>=1.8.6' 'zopfli>=0.2.2' 'intelhex>=2.3.0' 'rich>=14.0.0' 'urllib3<2' \
            'cryptography>=45.0.3' 'certifi>=2025.8.3' 'ecdsa>=0.19.1' 'bitstring>=4.3.1' \
            'reedsolo>=1.5.3,<1.8' 'esp-idf-size>=2.0.0' 'esp-coredump>=1.14.0'
      - name: Test notes, checklists and OTA release matching
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.4 libexpat1-dev zlib1g-dev
          lua scripts/test_notes.lua
          cmake -S crosspoint-upstream/test -B /tmp/firmware-tests
          cmake --build /tmp/firmware-tests --target OtaReleaseTest ReleaseJsonParserTest MarkdownTest MarkdownDocumentTest MarkdownChecklistTest NoteToolsTest -j2
          ctest --test-dir /tmp/firmware-tests -R '^(NoteToolsTest|Markdown|OtaRelease|ReleaseJsonParser)' --output-on-failure
      - name: Build X3/X4 release firmware
        working-directory: crosspoint-upstream
        run: pio run -e gh_release -j2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and package firmware
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/package_web_firmware.py --environment gh_release
          npm --prefix web-flasher test
          mkdir dist
          python3 scripts/package_plugin.py dist/buddysync-plugin.zip
          asset="buddypoint-${RELEASE_TAG#v}-x3-x4.bin"
          cp crosspoint-upstream/.pio/build/gh_release/firmware.bin "dist/$asset"
          (cd dist && sha256sum "$asset" buddysync-plugin.zip > SHA256SUMS.txt)
      - name: Publish complete release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "BuddyPoint ${RELEASE_TAG#v}" --generate-notes --latest
