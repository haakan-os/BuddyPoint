name: Firmware feature tests
on:
  push:
    branches: [main]
    paths: ['crosspoint-upstream/**', 'koreader-plugin/**', 'scripts/test*.lua', 'scripts/test*.mjs', '.github/workflows/feature-tests.yml']
  pull_request:
    paths: ['crosspoint-upstream/**', 'koreader-plugin/**', 'scripts/test*.lua', 'scripts/test*.mjs', '.github/workflows/feature-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y lua5.4 libexpat1-dev zlib1g-dev
      - name: Test KOReader notes and transfers
        run: lua scripts/test_notes.lua
      - name: Test AO3 web panel
        run: node scripts/test_ao3_web.mjs
      - name: Test library, Markdown, AO3 and OTA
        run: |
          cmake -S crosspoint-upstream/test -B /tmp/tests
          cmake --build /tmp/tests --target LibraryBuilderTest LibraryIndexFileTest MarkdownChecklistTest NoteToolsTest MarkdownDocumentTest MarkdownTest OtaReleaseTest ReleaseJsonParserTest Ao3Test Ao3ClientTest -j2
          ctest --test-dir /tmp/tests -R '^(LibraryBuilderTest|LibraryIndexFile|LibraryShelf|NoteToolsTest|Markdown|OtaRelease|ReleaseJsonParser|Ao3)' --output-on-failure
