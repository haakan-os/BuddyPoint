name: Web flasher
on:
  push:
    branches: [main]
    paths: ['web-flasher/**', '.github/workflows/web-flasher.yml']
  pull_request:
    paths: ['web-flasher/**', '.github/workflows/web-flasher.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-flasher-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: web-flasher
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp web-flasher/index.html web-flasher/style.css web-flasher/flasher.js web-flasher/flash-core.js _site/
          cp -r web-flasher/vendor web-flasher/firmware _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
