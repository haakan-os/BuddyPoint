services:
  bridge:
    image: buddypoint-ao3-bridge:local
    build:
      context: ..
      dockerfile: ao3-bridge/Dockerfile
    ports:
      - "${BRIDGE_BIND:-0.0.0.0}:${BRIDGE_PORT:-8080}:8080"
    environment:
      OPTIMIZE_EPUB: "${OPTIMIZE_EPUB:-true}"
      AO3_FORCE_IPV4: "${AO3_FORCE_IPV4:-false}"
    volumes:
      - bridge-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  bridge-data:
